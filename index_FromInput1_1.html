<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work for web 10-08-2569</title>
  <script src="file_javascript/algo_form.js" defer></script>
</head>

<body>
  <form id="transactionForm">
    <h1>รายรับราบจ่าย ส่วนบุคคล</h1>
    <label for="name">ชื่อของรายการ</label>
    <input id="name" type="text" name="name" maxlength="50" required>
    <br> <br>
    <label for="amount">จํานวนเงินทั้งหมด (บาท)</label>
    <input id="amount" type="number" name="amount" required min="0.01" step="0.01">
    <br> <br>
    <label for="date">วันที่</label>
    <input id="date" type="date" name="date" required>
    <br> <br>
    <label for="time">เวลา</label>
    <input id="time" type="time" name="time" required>
    <br> <br>
    <fieldset>
      <legend>ประเภท:</legend>

      <input type="radio" name="InOrEx" value="income">
      รายรับ

      <input type="radio" name="InOrEx" value="expense">
      รายจ่าย
    </fieldset>
    <br> <br>
    <input type="submit" value="เพิ่มรายการ">
    <input type="reset" value="ยกเลิก">
  </form>


  <p>ส่วนที่ใช้แสดงผลรายรับรายทั้งหมด</p>
  <div>
    <ul id="IncomeList">
      <li></li>
      <li></li>
      <li></li>
    </ul>
    <p id="totalIncome"></p>
  </div>
  <div>
    <ul id="ExprensesList">
      <li></li>
      <li></li>
      <li></li>
    </ul>
    <p id="totalExpensesิ"> </p>
  </div>
  <p id="balance"></p>
  <section>
    <p>รายรับรวม: <strong id="totalIncome">0.00 บาท</strong></p>
    <p>รายจ่ายรวม: <strong id="totalExpenses">0.00 บาท</strong></p>
    <p>ยอดคงเหลือ: <strong id="balance"> 0.00 บาท</strong></p>
    <p id="balanceWarning"></p>
  </section>
</body>

</html>
