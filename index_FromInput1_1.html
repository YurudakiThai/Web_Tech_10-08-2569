<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกรายรับ – รายจ่าย</title>
  <!-- UnoCSS Runtime สำหรับใช้ Utility Classes ได้เลยโดยไม่ต้อง Config -->
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>

<body>

  <div>
    <h1>ระบบบันทึกรายรับ – รายจ่าย</h1>

    <!-- ส่วนที่ 1.1: ฟอร์มรับข้อมูล -->
    <form id="transactionForm">
      <input type="text" id="title" placeholder="ชื่อรายการ" required maxlength="50">
      <input type="number" id="amount" placeholder="จำนวนเงิน" required min="1" step="0.01">
      <select id="type" required>
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
      <input type="date" id="date" required>
      <input type="time" id="time" required>
      <button type="submit">+ เพิ่มรายการ</button>
    </form>

    <!-- ส่วนที่ 1.2: สรุปยอดเงิน -->
    <div>
      <div>
        <p>รายรับรวม</p>
        <p id="totalIncome">0</p>
      </div>
      <div>
        <p>รายจ่ายรวม</p>
        <p id="totalExpense">0</p>
      </div>
      <div>
        <p>ยอดคงเหลือ</p>
        <p id="balance">0</p>
      </div>
    </div>

    <!-- ส่วนที่ 1.3: พื้นที่แสดงรายการ (List) -->
    <h2>รายการทั้งหมด</h2>
    <ul id="transactionList">
      <!-- รายการจะถูกสร้างด้วย JavaScript -->
    </ul>
  </div>

  <script src="file_javascript/algo_form.js"></script>
</body>

</html>
