<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกรายรับ–รายจ่าย</title>
</head>

<body>
  <h1>ระบบบันทึกรายรับ–รายจ่าย</h1>

  <section>
    <h2>เพิ่มรายการ</h2>
    <form id="transactionForm">
      <label for="title">ชื่อรายการ</label>
      <input id="title" type="text" required>

      <label for="amount">จํานวนเงิน (บาท)</label>
      <input id="amount" type="number" min="0.01" step="0.01" required>

      <label for="date">วันที่</label>
      <input id="date" type="date">

      <label for="time">เวลา</label>
      <input id="time" type="time">

      <label for="type">ประเภทรายการ</label>
      <select id="type" required>
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>

      <button type="submit">เพิ่มรายการ</button>
    </form>
  </section>

  <section>
    <h2>สรุปยอดเงิน</h2>
    <p>รายรับรวม: <span id="incomeTotal">0.00</span> บาท</p>
    <p>รายจ่ายรวม: <span id="expenseTotal">0.00</span> บาท</p>
    <p>ยอดคงเหลือ: <span id="balance">0.00</span> บาท</p>
  </section>

  <section>
    <h2>รายการทั้งหมด</h2>
    <input id="searchInput" type="search" placeholder="ค้นหาจากชื่อรายการ">

    <select id="filterType">
      <option value="all">แสดงทั้งหมด</option>
      <option value="income">เฉพาะรายรับ</option>
      <option value="expense">เฉพาะรายจ่าย</option>
    </select>

    <table border="1" cellpadding="8" cellspacing="0" width="100%">
      <caption>ตารางบันทึกรายรับและรายจ่าย</caption>
      <thead>
        <tr>
          <th scope="col">ลําดับ</th>
          <th scope="col">รายการ</th>
          <th scope="col">จํานวนเงิน</th>
          <th scope="col">วันที่</th>
          <th scope="col">เวลา</th>
          <th scope="col">ประเภท</th>
          <th scope="col">จัดการ</th>
        </tr>
      </thead>
      <tbody id="transactionList"></tbody>
    </table>
  </section>

  <script src="budget-app.js"></script>
</body>

</html>
