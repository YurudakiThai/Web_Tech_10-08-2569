<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
</head>

<body>
  <h1>
    แบบ from ลงทะเบียน เข้าเรียนวันนี้
    <!-- ชื่อ นามสกุล รหัสประจําตัว เวลาเข้าเรียน เหตุผล รายละเอียดหมายเหตุ -->
  </h1>
  <form style="display: flex; ">
    <label for="firstname">ชื่อ:</label>
    <input type="search" name="input" value="">
    <label for="studentID">รหัสประจตัว:</label>
    <input type="text" id="studentId" name="studentId" required pattern="[0-9]{10}"
      title="กรุณากรอกรหัสประจําตัว 10 หลัก">
    <br> <br>
    <label for="date">วันที่:</label>
    <input type="date" id="date" name="date" required>
    <br> <br>
    <label for="reason">เหตุผล:</label>
    <select id="reason" name="reason" required>
      <!-- <option value="">--กรุณาเลือกเหตุ---</option> -->
      <!-- <option value="สาย">สาย</option> -->
      <!-- <option value="ลาป่วย">ลาป่วย</option> -->
      <!-- <option value="ลากิจ">ลากิจ</option> -->
      <!-- <option value="อื่นๆ">อื่นๆ</option> -->

    </select>
    <br> <br>
    <label for="reason">เหตุผล:</label>
    <input type="radio" id="reason1" name="reason" value="สาย">
    <label for="">สาย</label>
    <input type="radio" id="reason2" name="reason" value="ลาป่วย">
    <input type="radio" id="reason3" name="reason" value="ลากิจ">
    <input type="checkbox" name="reason" value="">

    <br><br>
    <label for="details">รายละเอียดหมายเหตุ:</label>
    <textarea id="details" name="details" rows="4" cols="50"></textarea>

    <br><br>
    <input type="submit" name="" value="ส่งข้อมูล">
  </form>

</body>

</html>
